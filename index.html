<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#17324d" />
  <title>Зловживання процесуальними правами | Суддівська симуляція</title>
  <link rel="stylesheet" href="styles.css?v=20260929-5" />
  <link rel="stylesheet" href="enhancements.css?v=20260929-5" />
  <style>
    .nsju-logo-wrap,.nsju-logo-wrap.compact,.login-brand .nsju-logo-wrap{background:transparent!important;border:0!important;box-shadow:none!important;padding:0!important;border-radius:0!important;overflow:visible!important}
    .nsju-logo{filter:none!important;object-fit:contain!important;display:block!important;visibility:visible!important;opacity:1!important;width:76px!important;height:auto!important;min-width:76px!important}
    .login-brand{display:flex!important;align-items:center!important;gap:26px!important}
    .login-brand .nsju-logo-wrap{flex:0 0 124px!important;width:124px!important;max-width:124px!important}
    .login-brand .nsju-logo{width:124px!important;min-width:124px!important;max-width:124px!important;height:auto!important}
    .login-brand>div:last-child{min-width:0!important;flex:1 1 auto!important}
    .identity{gap:18px!important}
    .identity .nsju-logo-wrap.compact{flex:0 0 72px!important;width:72px!important;max-width:72px!important}
    .identity .nsju-logo-wrap.compact .nsju-logo{width:72px!important;min-width:72px!important;max-width:72px!important}
    .footer-brand img{background:transparent!important;border-radius:0!important;padding:0!important;filter:none!important;display:block!important;width:82px!important;min-width:82px!important;height:auto!important;visibility:visible!important;opacity:1!important}
    .final-scoreboard{margin-top:20px;text-align:center;background:linear-gradient(180deg,#17324d 0,#214b6d 100%);color:#fff;border:0!important}
    .final-scoreboard h2{color:#fff;font-size:32px;margin:4px 0 6px}
    .final-scoreboard .muted{color:#dce7ef!important}
    .final-score-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}
    .final-score-card{border:1px solid rgba(255,255,255,.32);border-radius:18px;padding:20px;background:#fff;color:#17324d;box-shadow:0 10px 24px rgba(0,0,0,.12)}
    .final-score-card .team-badge{display:inline-block;margin-bottom:10px;background:#f5eee3;color:#7b2f3d;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:800}
    .final-score-card strong{display:block;color:#17324d;font-size:18px}
    .final-score-card span{display:block;color:#7b2f3d;font-size:48px;font-weight:900;margin:8px 0 2px}
    .final-score-card small{color:#6e7780;font-size:13px}
    @media(max-width:760px){
      .final-score-grid{grid-template-columns:1fr}
      .login-brand{gap:16px!important}
      .login-brand .nsju-logo-wrap{flex-basis:92px!important;width:92px!important;max-width:92px!important}
      .login-brand .nsju-logo{width:92px!important;min-width:92px!important;max-width:92px!important}
      .identity .nsju-logo-wrap.compact{flex-basis:58px!important;width:58px!important;max-width:58px!important}
      .identity .nsju-logo-wrap.compact .nsju-logo{width:58px!important;min-width:58px!important;max-width:58px!important}
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="data.js?v=20260929-5"></script>
  <script src="app.js?v=20260929-5"></script>
  <script src="enhancements.js?v=20260929-5"></script>
  <script src="site-patches.js?v=20260929-5"></script>
</body>
</html>
