<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" role="img" aria-labelledby="title desc">
  <title id="title">Національна школа суддів України</title>
  <desc id="desc">Стилізована емблема для навчального інтерфейсу: овальний знак з книгою, суддівським молотком, академічною шапочкою та синьо-жовтою стрічкою.</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#a97925"/>
      <stop offset="0.5" stop-color="#e0bc6e"/>
      <stop offset="1" stop-color="#8b5f1f"/>
    </linearGradient>
    <path id="topArc" d="M 48 111 A 102 76 0 0 1 252 111"/>
    <path id="bottomArc" d="M 252 118 A 102 76 0 0 1 48 118"/>
  </defs>
  <ellipse cx="150" cy="112" rx="128" ry="94" fill="#f7f0df" stroke="url(#g)" stroke-width="7"/>
  <ellipse cx="150" cy="112" rx="111" ry="78" fill="#fffaf0" stroke="#7d2e3d" stroke-width="2.5"/>
  <text font-family="Georgia, serif" font-size="14" font-weight="700" fill="#7d2e3d" letter-spacing="1.1">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">НАЦІОНАЛЬНА ШКОЛА СУДДІВ УКРАЇНИ</textPath>
  </text>
  <text font-family="Georgia, serif" font-size="11.5" font-weight="700" fill="#17324d" letter-spacing=".8">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">NATIONAL SCHOOL OF JUDGES OF UKRAINE</textPath>
  </text>
  <g transform="translate(0 2)">
    <path d="M92 137 Q150 121 208 137 L204 157 Q150 143 96 157 Z" fill="#efe3c7" stroke="#9a7939" stroke-width="2"/>
    <path d="M150 128 L150 157" stroke="#9a7939" stroke-width="2"/>
    <path d="M111 126 L190 126 L190 136 L111 136 Z" fill="#f8efdb" stroke="#9a7939" stroke-width="2"/>
    <g transform="rotate(-28 150 104)">
      <rect x="139" y="73" width="22" height="60" rx="7" fill="#b78c43" stroke="#6f4a1a" stroke-width="2"/>
      <rect x="116" y="66" width="68" height="18" rx="5" fill="#c59b51" stroke="#6f4a1a" stroke-width="2"/>
    </g>
    <path d="M112 89 L150 71 L188 89 L150 107 Z" fill="#17324d"/>
